spring:
  application:
    name: tinder4dogs

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tinder4dogs}
    username: ${DATABASE_USER:tinder4dogs}
    password: ${DATABASE_PASSWORD:tinder4dogs}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  ai:
    openai:
      # The course gateway is OpenAI-compatible. Spring AI appends the
      # /v1/chat/completions path itself, so this value must NOT end in /v1.
      base-url: ${AI4DEV_GATEWAY_BASE_URL:https://aiproxy.ai4dev.dev}
      # A literal "unset" rather than an empty value, so that a fresh clone
      # starts and /api/ai/health answers with a readable reason, instead of the
      # application context failing to refresh before anybody has a key.
      api-key: ${AI4DEV_API_KEY:unset}
      chat:
        # Spring AI 2.0 removed the artificial `.options.` segment. In every 1.x
        # example this property is spring.ai.openai.chat.options.model.
        model: ${AI4DEV_MODEL:cheap}
        temperature: 0.2
      embedding:
        # Configured and unused, exactly as the chat model was before Module 12.
        #
        # Two things about this one line are worth knowing before Module 13's
        # first lab. The `.options.` segment is gone here too, as it is for
        # chat. And the default, if you delete this property, is
        # text-embedding-ada-002: a 2022 model that produces 1536 dimensions
        # just like the one you meant to use, so the index builds, the search
        # works, and nothing anywhere says you are using the wrong model.
        model: ${AI4DEV_EMBEDDING_MODEL:embed}

    # ─── where the vectors live ───────────────────────────────────────────────
    #
    # The index moved out of the application's heap and into the database the
    # product already runs. One of these properties is a product decision, one
    # of them has no effect at all, and knowing which is which is the lab.
    vectorstore:
      pgvector:
        # Liquibase owns DDL in this product, so the library creates nothing.
        #
        # `false` is ALSO the framework's default in 2.0 — the reference flags
        # it as a breaking change from the versions where the table appeared on
        # its own — and it is written out anyway, because a default that
        # decides where your schema comes from is not a default to inherit
        # silently.
        #
        # One consequence worth knowing before it bites: with this false and
        # `schema-validation` false (also the default), NOTHING checks at
        # startup that the table exists. A missing migration surfaces as a
        # failed INSERT the first time something indexes, not as a context that
        # refuses to refresh.
        initialize-schema: false
        # The framework's default here is HNSW: an approximate search from the
        # first query, before anybody decided the product could afford to be
        # approximate. In this product the index is changeset 007 instead, so
        # that turning it on is a reviewable change with a measurement either
        # side of it.
        #
        # AND THIS PROPERTY DOES NOTHING HERE. Read the store's source: the
        # index type is used in exactly one place, inside the branch that runs
        # only when `initialize-schema` is true. With Liquibase owning DDL the
        # index exists because changeset 007 ran, and not because of this line.
        # It stays because it documents the intent and would be the correct
        # value if anyone ever flipped the property above — not because it has
        # an effect. A property that looks like it controls your search's
        # accuracy and silently does not is worth meeting once, deliberately,
        # here, rather than for the first time in an incident.
        index-type: NONE
        # Must match the operator class in changeset 007: COSINE_DISTANCE is the
        # `<=>` operator and `vector_cosine_ops`. Mismatch them and PostgreSQL
        # never uses the index, the search is quietly back to a full scan, and
        # nothing anywhere reports it.
        distance-type: COSINE_DISTANCE
        # The table a developer will go and look at. Both are the defaults,
        # written down because `SELECT * FROM vector_store` is the first thing
        # anybody debugging this will type.
        schema-name: public
        table-name: vector_store
        # `dimensions` is deliberately NOT set. Unset, the store reads it from
        # the EmbeddingModel; set, it would be a third place that has to agree
        # with the `vector(1536)` column in changeset 006 and with the model in
        # `spring.ai.openai.embedding.model` above. Two is already one too many.

  # Google sign-in is configured ENTIRELY from the environment. Nothing is
  # committed here, which is the rule this repository has followed since Module
  # 1, and with no variables set there is no client registration: the
  # application starts anyway and every request is the local developer.
  #
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=...
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=...
  #
  # Spring Boot supplies Google's endpoints from its common-provider defaults,
  # so the id and the secret are all that is needed.

server:
  port: 8080

logging:
  level:
    com.ai4dev.tinder4dogs: INFO

# Where the single-page application lives. Used for the CORS policy and for the
# redirect that sends the browser back after sign-in.
app:
  spa:
    origin: ${SPA_ORIGIN:http://localhost:5173}

  # ─── the index-time gate ──────────────────────────────────────────────────
  #
  # It refuses to index. It does not clean, fix, or do its best. Every value
  # here is a decision somebody made and can be argued with in a diff.
  knowledge:
    gate:
      # Off only to demonstrate what the gate was preventing. The application
      # logs a warning at every index build while it is false.
      enabled: ${AI4DEV_GATE_ENABLED:true}
      # A DATE, not "older than N months". A rolling window changes the gate's
      # verdict on a morning when nobody changed anything, and that is how a
      # team learns to ignore a build failure. Moving this date is a deliberate
      # act, visible in a diff, with a name on it.
      stale-before: ${AI4DEV_GATE_STALE_BEFORE:2026-01-01}
      # Above this cosine similarity two documents are the same document. Do not
      # inherit this number: CorpusGateTest prints every pair's similarity, so
      # pick it from the distribution of YOUR corpus.
      duplicate-similarity: ${AI4DEV_GATE_DUPLICATE_SIMILARITY:0.95}
      # The near-duplicate rule costs one embedding call per document and puts a
      # network dependency inside your gate. The other three rules are free and
      # deterministic. This is the one to decide about before putting the gate
      # in continuous integration.
      check-near-duplicates: ${AI4DEV_GATE_NEAR_DUPLICATES:true}
      # Exceptions, as `file:RULE:reason`, separated by semicolons. THE REASON IS
      # MANDATORY and the gate refuses to start without it: an allow-list with
      # no reasons becomes a list nobody dares to shorten, because nobody knows
      # which entries were considered and which were somebody silencing a build.
      allow: >-
        faq-generale.md:PII:the published support address, not a person's

  # ─── the support bot ──────────────────────────────────────────────────────
  support:
    # How many chunks go into the prompt, per question, for ever. The splitter
    # decided how big each one is, so this number multiplies that decision by
    # itself. Three is what the retrieval harness measures recall at, which is
    # what keeps the number the product was built on and the number it runs on
    # the same one.
    top-k: ${AI4DEV_SUPPORT_TOP_K:3}
    # The floor under the similarity score, below which a chunk is not context.
    #
    # ZERO IS THE FRAMEWORK'S DEFAULT AND IT IS NOT A RECOMMENDATION. At zero
    # there is no floor: every question retrieves three chunks, the context is
    # never empty, and the "I do not know" path the prompt politely describes
    # cannot be reached. The service logs a warning at startup while this is
    # zero, because a product that cannot refuse is the thing this module is
    # about.
    #
    # The right value cannot be told to you. It depends on the embedding model,
    # on the corpus, and on whether the index is exact or approximate. Measure
    # it with ThresholdSweepTest, which prints the recall you lose at every
    # floor and the two numbers that decide whether a floor exists at all, then
    # put that number here with the date you measured it.
    similarity-threshold: ${AI4DEV_SUPPORT_THRESHOLD:0.0}

  prompts:
    # Which deployed version to serve. In Langfuse a version is deployed by
    # moving this label onto it, and rolled back by moving it back.
    label: ${LANGFUSE_PROMPT_LABEL:production}
    # How long a fetched prompt is trusted before it is refreshed. The official
    # Langfuse SDKs default to 60 seconds; on the JVM there is no SDK, so this is
    # a number somebody chose rather than inherited.
    cache-ttl-seconds: ${LANGFUSE_PROMPT_CACHE_TTL:60}

  # Leave these unset and prompts come from the jar, which is what a fresh clone
  # does before anybody has created a Langfuse project. Nothing is committed
  # here, the same rule the gateway and Google sign-in already follow.
  langfuse:
    host: ${LANGFUSE_HOST:}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
